[project]
name = "rag-worker"
version = "0.1.0"
description = "Background worker: cron-scheduled source syncs and document indexing"
requires-python = ">=3.12"
dependencies = [
    "rag-core[docling]",
    "procrastinate>=3.0",
    "croniter>=3.0",
]

[project.scripts]
rag-worker = "rag_worker.__main__:main"
rag-apply-schema = "rag_worker.schema:main"
rag-gc-blobs = "rag_worker.gc:main"

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_worker"]
