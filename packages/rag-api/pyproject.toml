[project]
name = "rag-api"
version = "0.1.0"
description = "FastAPI service: auth (Microsoft Entra ID), RBAC, collection/source management, search"
requires-python = ">=3.12"
dependencies = [
    "rag-core",
    "fastapi>=0.115",
    "fastapi-mcp>=0.4",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.18",
]

[project.scripts]
rag-api = "rag_api.__main__:main"

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]
