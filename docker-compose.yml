services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && rag-apply-schema"]
    environment: &app-env
      RAG_DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      RAG_ENVIRONMENT: dev
      RAG_AUTH__MODE: ${RAG_AUTH__MODE:-disabled}
      RAG_AUTH__TENANT_ID: ${RAG_AUTH__TENANT_ID:-}
      RAG_AUTH__AUDIENCE: ${RAG_AUTH__AUDIENCE:-}
      RAG_AUTH__SPA_CLIENT_ID: ${RAG_AUTH__SPA_CLIENT_ID:-}
      RAG_AUTH__API_SCOPE: ${RAG_AUTH__API_SCOPE:-}
      RAG_AUTH__DEFAULT_ROLE: ${RAG_AUTH__DEFAULT_ROLE:-user}
      RAG_EMBEDDING__PLUGIN: ${RAG_EMBEDDING__PLUGIN:-fake}
      RAG_EMBEDDING__DIM: ${RAG_EMBEDDING__DIM:-1536}
      # JSON plugin config; empty falls back to the in-code default.
      RAG_EMBEDDING__CONFIG: ${RAG_EMBEDDING__CONFIG:-}
      RAG_BLOB_DIR: /data/blobs
      RAG_CACHE_DIR: /data/cache
      # Docling layout/table models download here on first use and persist in
      # the appdata volume (only the worker parses; harmless for the API).
      HF_HOME: /data/cache/hf
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${RAG_API_PORT:-8080}:8000"
    volumes:
      - appdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ["rag-worker"]
    environment: *app-env
    volumes:
      - appdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  appdata:
