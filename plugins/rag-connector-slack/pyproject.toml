[project]
name = "rag-connector-slack"
version = "0.1.0"
description = "Slack channel connector (daily message digests per channel)"
requires-python = ">=3.12"
dependencies = ["rag-core", "httpx>=0.27"]

[project.entry-points."rag.connectors"]
slack = "rag_connector_slack.connector:SlackConnector"

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_connector_slack"]
