[project]
name = "rag-platform"
version = "0.1.0"
description = "Extensible, plugin-driven enterprise RAG platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rag-core",
    "rag-api",
    "rag-worker",
    "rag-connector-confluence",
    "rag-connector-sharepoint",
    "rag-connector-git",
    "rag-connector-slack",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[tool.uv.sources]
rag-core = { workspace = true }
rag-api = { workspace = true }
rag-worker = { workspace = true }
rag-connector-confluence = { workspace = true }
rag-connector-sharepoint = { workspace = true }
rag-connector-git = { workspace = true }
rag-connector-slack = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "plugins/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency factories used in parameter defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "collection_access",
    "rag_api.deps.collection_access",
]

[tool.ruff.lint.isort]
known-first-party = ["rag_core", "rag_api", "rag_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
